name: Deploy static site
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4
      - name: Опубликовать на GitHub Pages
        uses: actions/deploy-pages@v4
        
